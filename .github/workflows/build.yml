name: Build AAB Final

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install All Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-dev \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip3 install --upgrade pip
          pip3 install Cython==0.29.36 buildozer virtualenv

      - name: Build AAB - Final Attempt
        run: |
          yes | buildozer -v android release

      - name: Upload Final AAB
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-FINAL-AAB
          path: bin/*.aab
