name: Build AAB Final

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer Cython==0.29.36 virtualenv

      - name: Build AAB - Final Attempt
        run: |
          yes | buildozer android release

      - name: Upload Final AAB
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-FINAL-AAB
          path: bin/*.aab
