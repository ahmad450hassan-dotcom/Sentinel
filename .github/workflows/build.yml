name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Packages
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk python3-pip libffi-dev libssl-dev
          pip install buildozer cython==0.29.33
      - name: Fix Build Tools
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" || true
      - name: Create Spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = SENTINEL
          package.name = sentinel
          package.domain = com.ahmad.sentinel
          source.dir =.
          source.include_exts = py,png,jpg,kv,json
          version = 1.0
          requirements = python3,kivy==2.3.0,numpy,pillow,opencv-python
          orientation = portrait
          android.permissions = CAMERA,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,INTERNET
          android.api = 34
          android.minapi = 21
   
          android.ndk = 25b
          android.build_tools_version = 34.0.0
          android.accept_sdk_license_agreements = True
          android.release_artifact = aab
          [buildozer]
          log_level = 2
          EOF
      - name: Build AAB
        run: buildozer android release
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-AAB-FINAL
          path: bin/*.aab
