name: Build AAB Final

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer==1.5.0 cython==0.29.33 virtualenv

      - name: Build AAB - Final Attempt
        run: |
          yes | buildozer android appbundle debug || (sleep 15 && yes | buildozer android appbundle debug)

      - name: Upload Final AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-FINAL-AAB
          path: bin/*.aab
